[book]
title = "在线游戏平台文档"
authors = ["onlinegame"]
description = "在线游戏平台:平台介绍、玩家使用指南与游戏开发商接入文档"
language = "zh"
src = "src"

[build]
create-missing = false

[output.html]
site-url = "/docs/"
default-theme = "light"
preferred-dark-theme = "navy"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = true
limit-results = 20

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
